# Netlify hosts the frontend only. The backend is deployed separately (see README).
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: every path is served by index.html and routed in the browser
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
